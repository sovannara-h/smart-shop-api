spring.datasource.url=jdbc:postgresql://localhost:5432/smart_shop
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# spring.h2.console.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuration Redis
spring.redis.host=localhost
spring.redis.port=6379
# spring.redis.password=votre_mot_de_passe  # Si vous avez un mot de passe
spring.cache.redis.time-to-live=3600000     # TTL en millisecondes (1 heure)

# Configuration Redis Cluster
spring.redis.cluster.nodes=localhost:6379,localhost:6380,localhost:6381
spring.redis.cluster.max-redirects=3

# Configuration Caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m

# Type de cache
spring.cache.type=COMPOSITE

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Métriques personnalisées
management.metrics.enable.all=true 