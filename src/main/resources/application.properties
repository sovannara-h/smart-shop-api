# Supabase Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
jwt.secret=${JWT_SECRET}

# SSL Configuration for Supabase
spring.datasource.hikari.ssl-mode=require

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.uri=classpath:ehcache.xml
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=25
spring.jpa.open-in-view=false

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Cache Configuration générale
spring.cache.type=COMPOSITE
spring.cache.redis.time-to-live=3600000

# Caffeine Configuration
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.enable.all=true

# DDOS Protection
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.max-threads=200
ddos.max-requests-per-minute=100

# CORS Configuration
spring.mvc.cors.mapping=/**
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Default active profile
spring.profiles.active=dev

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=SmartEcommerceHikariCP

# Optimisation des performances
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Monitoring des requêtes lentes
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=25

# Optimisation des performances pour LAZY loading
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# N'activez PAS open-in-view pour éviter les antipatterns - sauf si vous avez une raison valable
spring.jpa.open-in-view=false

# Configuration du cache de requêtes Hibernate
spring.jpa.properties.hibernate.cache.use_query_cache=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
# spring.redis.password=your_password  
spring.cache.redis.time-to-live=3600000     

# Redis Cluster Configuration
spring.redis.cluster.nodes=localhost:6379,localhost:6380,localhost:6381
spring.redis.cluster.max-redirects=3

