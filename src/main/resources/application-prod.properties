vault.uri=https://vault-prod.company.com
vault.token=${VAULT_PROD_TOKEN}
secret.rotation.jwt.cron=0 0 1 * * *
notification.admin.email=admin-prod@company.com
notification.slack.webhook=${SLACK_WEBHOOK_PROD}

# JPA Configuration sécurisée pour la production
spring.jpa.hibernate.ddl-auto=none

# Configuration Redis Cluster pour production
spring.redis.password=Pr0d_P@ssw0rd_S3cure!
spring.redis.ssl=true

# Configuration du cluster Redis
spring.redis.cluster.nodes=redis1:6379,redis2:6379,redis3:6379
spring.redis.cluster.max-redirects=3
spring.redis.cluster.timeout=2000
spring.redis.cluster.max-attempts=5

# Configuration du pool de connexions pour production
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.shutdown-timeout=100ms

# Configuration de résilience
spring.redis.lettuce.cluster.refresh.adaptive=true
spring.redis.lettuce.cluster.refresh.period=30s 